<body>
  <div class="ar-progress" id="ar-progress"></div>
  <header id="nb-header" style="min-height:96px"></header>

  <main class="ar-wrap">
    <div id="ar-main"><div class="ar-loading"><div class="nb-skeleton" style="height:320px;border-radius:28px;margin-bottom:20px"></div><div class="nb-skeleton" style="height:26px;width:70%;margin:0 auto 12px"></div><div class="nb-skeleton" style="height:16px;width:40%;margin:0 auto"></div></div></div>
    <aside class="ar-side" id="ar-side"></aside>
  </main>

  <div id="nb-footer"></div>

  <script type="module">
    import { auth, db } from '/js/firebase-init.js';
    import { escapeHtml as esc, articleImg, getTopArticles, articleCardHtml, getVisibleProducts, productCardHtml, productMatchesStage, MEDICAL_SUBCATS } from '/js/utils.js';
    import { PLAY_URL } from '/js/site-config.js';
    import { adSlot, mountAds } from '/js/ads.js';

    const CAT = { pregnancy: ['🤰', 'الحمل والولادة'], baby: ['👶', 'رعاية الرضيع'], beauty: ['💄', 'الجمال والعناية'], fertility: ['🌸', 'التبويض والخصوبة'], health: ['💗', 'صحة المرأة'], marriage: ['💕', 'الحياة الزوجية'] };
    // أدوات الموقع المجانية حسب toolType، والباقي يدعو للتطبيق
    const TOOLS = {
      ovulation_calc: ['/tools/ovulation.html', '🗓️'], period_tracker: ['/cycle', '🌸'], pregnancy_wheel: ['/tools/due-date.html', '🎡'],
      pregnancy_tracker: ['/pregnancy', '🤰'], baby_growth: ['/baby', '👶'], baby_tracker: ['/baby', '🍼'],
    };
    const STAGE_FOR_CAT = { pregnancy: 'pregnant', baby: 'newborn', fertility: 'pregnant', beauty: 'mom', health: 'mom', marriage: 'mom' };

    let art = null;
    let user = null;
    auth.onAuthStateChanged((u) => { user = u; updateSaveBtn(); });

    function idFromUrl() {
      const m = location.pathname.match(/\/article\/([^/?#]+)/);
      if (m) return decodeURIComponent(m[1]);
      const q = new URLSearchParams(location.search);
      return q.get('id') || (location.hash ? location.hash.slice(1) : null);
    }

    async function load() {
      let id = idFromUrl();
      if (!id) return notFound();
      // روابط فيسبوك القديمة: /article/<originalId>/<slug> → نترجم الرقم إلى المعرّف
      if (/^\d+$/.test(id)) {
        try { const map = await (await fetch('/data/articles/id_map.json')).json(); if (map[id]) id = map[id]; } catch (_) {}
      }
      if (!/^[\w-]+$/.test(id)) return notFound();
      try {
        const r = await fetch(`/data/articles/${id}.json`);
        if (!r.ok) return notFound();
        art = await r.json();
      } catch (_) { return notFound(); }
      if (location.pathname !== `/article/${art.id}`) history.replaceState(null, '', `/article/${art.id}`);
      render();
      side();
      seo();
    }

    function notFound() {
      document.title = 'المقال غير موجود — نبضة';
      document.getElementById('ar-main').innerHTML = `
        <div class="ar-hero" style="padding:50px 24px;text-align:center">
          <div style="font-size:48px">🌸</div>
          <h1 style="font-size:22px;font-weight:900;margin:12px 0 8px">لم نجد هذا المقال</h1>
          <p style="color:var(--nb-ink-3);margin-bottom:20px">ربما تغيّر رابطه. تصفّحي موسوعة نبضة لتجدي ما تبحثين عنه.</p>
          <a class="nb-btn-primary" href="/articles" style="text-decoration:none">موسوعة نبضة ←</a>
        </div>`;
      const meta = document.createElement('meta'); meta.name = 'robots'; meta.content = 'noindex'; document.head.appendChild(meta);
    }

    const para = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    // عناوين قالبية فارغة المعنى تتكرّر في كل المقالات — لا تُعرض
    const GENERIC_TITLES = new Set(['نظرة شاملة ودليل متكامل', 'نظرة شاملة وتفاصيل مهمة', 'مدخل وتفسير شامل', 'التفاصيل العملية والخطوات الموصى بها', 'أهم التفاصيل والإرشادات']);
    const DISCLAIMER_TITLE = '⚠️ تنويه';
    const H_END = '\u0001';

    /**
     * يحوّل النص الملتصق إلى فقرات مقروءة:
     * - «سؤال؟كلمة» (عنوان فرعي ملتصق بالنص) ← عنوان فرعي h3
     * - «نصيحة اليوم» في بداية جملة ← فقرة نصيحة 💡 (وتُحذف إن جاءت وسط جملة)
     * - الجمل تُجمع في فقرات من 2-3 جمل (~380 حرفاً)
     * يعيد مصفوفة كتل: { type: 'h'|'p'|'tip', text }
     */
    function toBlocks(raw) {
      const LI = '\u0002';
      const NUM = '\u0003';  // بداية عنصر مرقّم: NUM + رقم + NUM_END
      const NUM_END = '\u0004';
      const blocks = [];
      const pushP = (txt) => {
        // فقرة بلا علامات وقف طويلة جداً ← تقسيم ليّن عند «؛» أو «،» بعد 260 حرفاً
        let t = txt.trim();
        while (t.length > 520) {
          const cut = Math.max(t.indexOf('؛ ', 260), -1) > -1 ? t.indexOf('؛ ', 260) : t.indexOf('، ', 300);
          if (cut < 0 || cut > t.length - 80) break;
          blocks.push({ type: 'p', text: t.slice(0, cut + 1).trim() });
          t = t.slice(cut + 1).trim();
        }
        if (t) blocks.push({ type: 'p', text: t });
      };
      String(raw || '').replace(/\r/g, '').split(/\n{2,}/).forEach((chunk) => {
        let t = chunk.trim();
        if (!t) return;
        if (t.startsWith('## ')) { blocks.push({ type: 'h', text: t.slice(3).trim() }); return; }
        t = t.replace(/\s*\n\s*/g, ' ')
             .replace(/&?curren;|¤/g, LI)                                     // بقايا ترميز HTML استُعملت كنقاط
             .replace(/\s*•\s*/g, LI)
             .replace(/([ء-يً-ْ])\s*[«»]\s*(?=[ء-ي])/g, '$1 ') // «» ملتصقة بين كلمتين = سطر مفقود
             .replace(/»\s*«/g, ' ')
             // قوائم مرقّمة من المصدر: «و 8. عنوان…» (الـ«و» بقايا فاصل أسطر) أو «… . 3. عنوان»
             .replace(/(^|\s)و\s*(\d{1,2})\s*[.\-)]\s+/g, `$1${NUM}$2${NUM_END}`)
             .replace(/(^|[.!؟?…:]\s+)(\d{1,2})\s*[.\-)]\s+(?=[\u0621-\u064A])/g, `$1${NUM}$2${NUM_END}`)
             .replace(/^و\s+/, '')                                              // «و» يتيمة في أوّل النص
             .replace(/(^|\s)و\s+(?=و)/g, '$1')                               // «و ومن…» حرف عطف يتيم من النسخ
             .replace(/([؟?])(?=[ء-ي])/g, '$1' + H_END)               // سؤال ملتصق بما بعده = عنوان
             .replace(/\s{2,}/g, ' ');
        const sentences = t.split(new RegExp(`(?<=[.!؟?…])(?![.!؟?…${H_END}"»])\\s*|(?<=${H_END})\\s*|(?=${LI})|(?=${NUM})`)).map((x) => x.trim()).filter(Boolean);
        let buf = []; let list = null; let num = null;
        const flush = () => { if (buf.length) { pushP(buf.join(' ')); buf = []; } };
        const endList = () => { if (list) { blocks.push({ type: 'ul', items: list }); list = null; } };
        const endNum = () => { if (num) { blocks.push(num); num = null; } };
        for (let sen of sentences) {
          if (sen.startsWith(NUM)) {
            flush(); endList(); endNum();
            const end = sen.indexOf(NUM_END);
            num = { type: 'num', n: sen.slice(1, end), text: sen.slice(end + 1).trim() };
            continue;
          }
          // الجمل التالية تنتمي للعنصر المرقّم حتى العنصر التالي أو عنوان أو نصيحة
          if (num && !sen.endsWith(H_END) && !/^نصيحة اليوم/.test(sen) && !sen.startsWith(LI)) {
            if (num.text.length < 700) { num.text += ' ' + sen; continue; }
            endNum();
          } else endNum();
          if (sen.startsWith(LI)) {
            flush();
            const item = sen.slice(1).replace(/^[\s:]+/, '').trim();
            if (item) (list = list || []).push(item);
            continue;
          }
          // جملة تابعة لعنصر قائمة (بلا نقطة جديدة) تُلحق به
          if (list && !sen.endsWith(H_END) && !/^نصيحة اليوم/.test(sen) && list[list.length - 1].length < 220) { list[list.length - 1] += ' ' + sen; continue; }
          endList();
          if (sen.endsWith(H_END)) {
            const h = sen.slice(0, -1).replace(/^و\s+/, '').trim();
            if (h.length <= 110 && h.split(/\s+/).length <= 16) { flush(); blocks.push({ type: 'h', text: h }); continue; }
            sen = h;
          }
          if (/^نصيحة اليوم\s*/.test(sen)) {
            flush();
            const tip = sen.replace(/^نصيحة اليوم[:\s]*/, '').trim();
            if (tip) blocks.push({ type: 'tip', text: tip });
            continue;
          }
          sen = sen.replace(/\s*نصيحة اليوم\s*/g, ' ').trim();
          if (!sen) continue;
          buf.push(sen);
          if (buf.length >= 3 || buf.join(' ').length >= 380) flush();
        }
        flush(); endList(); endNum();
      });
      return blocks;
    }

    function blocksHtml(blocks, headings) {
      return blocks.map((b) => {
        if (b.type === 'h') { const id = 'h' + headings.length; headings.push({ id, text: b.text }); return `<h3 id="${id}">${para(b.text)}</h3>`; }
        if (b.type === 'tip') return `<div class="ar-tip">💡 ${para(b.text)}</div>`;
        // «العنوان: الشرح» ← العنوان بالخط العريض
        const li = (x) => { const i = x.indexOf(':'); return i > 0 && i < 70 ? `<strong>${para(x.slice(0, i + 1))}</strong>${para(x.slice(i + 1))}` : para(x); };
        if (b.type === 'num') {
          // عنوان العنصر: أوّل جملة قصيرة، أو الكلمات قبل تكرار الكلمة الأولى («الإجهاد المطول يدمر الدماغ الإجهاد المطول يسبب…»)
          const words = b.text.split(/\s+/);
          let head = ''; let rest = b.text;
          const m = b.text.match(/^(.{4,80}?[!؟?])\s+/);
          if (m) { head = m[1]; rest = b.text.slice(m[0].length); }
          else { for (let k = 2; k <= 10 && k < words.length; k++) if (words[k] === words[0]) { head = words.slice(0, k).join(' '); rest = words.slice(k).join(' '); break; } }
          return `<div class="ar-num"><span class="ar-num-n">${esc(b.n)}</span><div>${head ? `<strong class="ar-num-h">${para(head)}</strong>` : ''}<p>${para(rest)}</p></div></div>`;
        }
        if (b.type === 'ul') return `<ul class="ar-points">${b.items.map((x) => `<li><span>${li(x)}</span></li>`).join('')}</ul>`;
        return `<p>${para(b.text)}</p>`;
      });
    }

    function render() {
      const [emoji, catName] = CAT[art.categoryId] || ['📖', art.categoryName || 'موسوعة نبضة'];
      const sections = Array.isArray(art.sections) ? art.sections : [];
      const headings = [];
      let disclaimer = '';
      const parts = [];
      sections.forEach((s, i) => {
        const title = String(s.title || '').trim();
        if (title === DISCLAIMER_TITLE) { disclaimer = String(s.content || '').trim(); return; }
        if (title && !GENERIC_TITLES.has(title)) { const id = 's' + i; headings.push({ id, text: title, h2: true }); parts.push(`<h2 id="${id}">${esc(title)}</h2>`); }
        parts.push(...blocksHtml(toBlocks(s.content), headings));
        if ((s.bulletPoints || []).length) parts.push(`<ul class="ar-points">${s.bulletPoints.map((x) => `<li><span>${para(x)}</span></li>`).join('')}</ul>`);
        if (s.calloutTip) parts.push(`<div class="ar-tip">💡 <strong>نصيحة:</strong> ${para(s.calloutTip)}</div>`);
        if (s.calloutWarning) parts.push(`<div class="ar-warn">⚠️ <strong>انتبهي:</strong> ${para(s.calloutWarning)}</div>`);
      });
      // كاروسال منتجات صغير في منتصف المقال (بعد فقرة، لا بعد عنوان)
      if (parts.length >= 6) {
        let mid = Math.floor(parts.length / 2);
        while (mid < parts.length - 1 && /^<h[23]/.test(parts[mid])) mid++;
        parts.splice(mid + 1, 0, '<div id="ar-mid-products"></div>');
      }
      // مساحات إعلانية داخل المقال: بعد الفقرة الثانية، وفي ثلثي المقال إن كان طويلاً
      const isText = (x) => /^<p|^<div class="ar-num|^<div class="ar-tip|^<ul/.test(x);
      const nth = (k) => { let c = 0; for (let i = 0; i < parts.length; i++) if (isText(parts[i]) && ++c === k) return i; return -1; };
      const p2 = nth(2);
      if (p2 > -1) parts.splice(p2 + 1, 0, adSlot('articleTop'));
      const textCount = parts.filter(isText).length;
      if (textCount >= 9) { const at = nth(Math.round(textCount * 0.66)); if (at > -1) parts.splice(at + 1, 0, adSlot('articleMid')); }
      const body = parts.join('');
      const toc = headings.length >= 3
        ? `<nav class="ar-toc" aria-label="محتويات المقال"><strong>📑 محتويات المقال</strong><ol>${headings.slice(0, 12).map((h) => `<li><a href="#${h.id}">${esc(h.text)}</a></li>`).join('')}</ol></nav>` : '';

      const tool = art.toolTitle ? (() => {
        const t = TOOLS[art.toolType];
        const href = t ? t[0] : PLAY_URL;
        return `<a class="ar-tool" href="${href}" ${t ? '' : 'target="_blank" rel="noopener"'}>
          <span class="ar-tool-ic">${t ? t[1] : '📱'}</span>
          <span style="flex:1"><strong style="display:block;font-size:16.5px">${esc(art.toolTitle)}</strong><span style="opacity:.92;font-size:13.5px">${esc(art.toolSubtitle || '')}${t ? '' : ' — متاحة في تطبيق نبضة'}</span></span>
          <span style="font-size:20px">←</span></a>`;
      })() : '';

      const faqs = (art.faqs || []).length ? `<h2 id="faq">❓ أسئلة شائعة</h2>${art.faqs.map((f) => `<details class="ar-faq"><summary>${esc(f.question)}</summary><p>${para(f.answer)}</p></details>`).join('')}` : '';

      document.getElementById('ar-main').innerHTML = `
        <nav class="ar-bc" aria-label="مسار التنقّل"><a href="/">الرئيسية</a><span>›</span><a href="/articles">موسوعة نبضة</a><span>›</span><a href="/articles?cat=${esc(art.categoryId)}">${esc(catName)}</a></nav>
        <article>
          <div class="ar-hero">
            <img class="ar-hero-img" src="${esc(articleImg(art.imagePath))}" alt="${esc(art.title)}">
            <div class="ar-hero-body">
              <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                <a class="ar-cat" href="/articles?cat=${esc(art.categoryId)}">${emoji} ${esc(art.subcategoryName || catName)}</a>
                ${art.badge ? `<span class="ar-badge">${esc(art.badge)}</span>` : ''}
              </div>
              <h1 class="ar-title">${esc(art.title)}</h1>
              <div class="ar-meta">
                <span>✍️ فريق تحرير نبضة</span>
                <span>⏱️ ${esc(art.readTime || '5 دقائق')} قراءة</span>
                ${art.originalViews ? `<span>👁️ ${Number(art.originalViews).toLocaleString('en-US')} قراءة</span>` : ''}
              </div>
              <div class="ar-actions">
                <button class="ar-btn" id="ar-save">🔖 حفظ</button>
                <a class="ar-btn" id="ar-wa" target="_blank" rel="noopener">💬 واتساب</a>
                <a class="ar-btn" id="ar-fb" target="_blank" rel="noopener">📘 فيسبوك</a>
                <button class="ar-btn" id="ar-copy">🔗 نسخ الرابط</button>
                <button class="ar-btn" onclick="window.print()">🖨️ طباعة</button>
              </div>
            </div>
          </div>
          <div class="ar-body">
            ${toc}
            ${body}
            ${tool}
            ${adSlot('articleEnd')}
            ${faqs}
            <div class="ar-disclaimer">⚠️ ${esc(disclaimer || 'هذا المقال للتثقيف العام من إعداد فريق تحرير نبضة، ولا يُغني عن استشارة الطبيبة أو المختصّة في حالتكِ الخاصة.')}</div>
          </div>
        </article>
        <h2 class="ar-section-title">🛍️ منتجات قد تهمّكِ</h2>
        <div class="nb-prod" id="ar-products"></div>
        <h2 class="ar-section-title">📚 اقرئي أيضاً</h2>
        <div class="nb-art-grid" id="ar-related"></div>`;

      const url = location.origin + '/article/' + art.id;
      document.getElementById('ar-wa').href = 'https://wa.me/?text=' + encodeURIComponent(art.title + '\n' + url);
      document.getElementById('ar-fb').href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url);
      document.getElementById('ar-copy').onclick = () => navigator.clipboard.writeText(url).then(() => window.nbToast?.('تم نسخ الرابط 🔗'));
      document.getElementById('ar-save').onclick = toggleSave;
      updateSaveBtn();
      products();
      related();
      mountAds(document.getElementById('ar-main'));
    }

    async function products() {
      try {
        const all = await getVisibleProducts();
        const stage = STAGE_FOR_CAT[art.categoryId] || 'mom';
        const fit = all.filter((p) => productMatchesStage(p, stage));
        const big = [...fit, ...all.filter((p) => !fit.includes(p))].slice(0, 10);
        const box = document.getElementById('ar-products');
        if (!big.length) { box.previousElementSibling.remove(); box.remove(); return; }
        box.innerHTML = big.map(productCardHtml).join('');
        const mid = document.getElementById('ar-mid-products');
        if (mid && fit.length) mid.innerHTML = `<div style="margin:24px 0;padding:16px;background:#FFF9FC;border:1px solid #F8E1EA;border-radius:18px"><div style="font-weight:900;margin-bottom:12px;font-size:15px">🛍️ منتجات ذات صلة</div><div class="nb-prod">${fit.slice(0, 4).map(productCardHtml).join('')}</div></div>`;
      } catch (_) {}
    }

    async function related() {
      const list = (await getTopArticles(art.categoryId)).filter((a) => a.id !== art.id);
      const same = list.filter((a) => a.subcategoryId === art.subcategoryId);
      const pick = [...same, ...list.filter((a) => !same.includes(a))].slice(0, 8);
      document.getElementById('ar-related').innerHTML = pick.map((a) => articleCardHtml(a, (CAT[art.categoryId] || ['📖'])[0])).join('');
      return pick;
    }

    async function side() {
      const list = (await getTopArticles(art.categoryId)).filter((a) => a.id !== art.id).slice(0, 6);
      const tools = [
        ['/tools/due-date.html', '🎡', 'حاسبة موعد الولادة'], ['/tools/ovulation.html', '🗓️', 'حاسبة التبويض'],
        ['/tools/fetus-size.html', '🍋', 'حجم الجنين أسبوعياً'], ['/tools/baby-names.html', '👶', 'أسماء المواليد'],
      ];
      document.getElementById('ar-side').innerHTML = `
        <div class="ar-side-card"><h4>🔥 الأكثر قراءة</h4>${list.map((a) => `<a class="ar-mini" href="/article/${encodeURIComponent(a.id)}"><img src="${esc(articleImg(a.imagePath))}" alt="" loading="lazy"><span>${esc(a.title)}</span></a>`).join('')}</div>
        ${adSlot('sidebar')}
        <div class="ar-side-card"><h4>💡 أدوات مجانية</h4>${tools.map(([h, i, t]) => `<a class="ar-mini" href="${h}" style="align-items:center"><span style="font-size:22px;-webkit-line-clamp:1">${i}</span><span>${t}</span></a>`).join('')}</div>
        <div class="ar-side-card" style="background:linear-gradient(135deg,#FFF0F5,#FCE4EC);text-align:center">
          <div style="font-size:34px">📱</div><h4 style="margin:6px 0">تطبيق نبضة</h4>
          <p style="font-size:13px;color:var(--nb-ink-3);margin-bottom:12px">تابعي رحلتكِ يوماً بيوم مع تنبيهات وأدوات مخصّصة.</p>
          <a href="${PLAY_URL}" target="_blank" rel="noopener" class="nb-btn-primary" style="text-decoration:none;display:block">حمّليه من Google Play</a>
        </div>
        ${adSlot('sidebarSticky')}`;
      mountAds(document.getElementById('ar-side'));
    }

    /* الحفظ: محلياً دائماً + في حساب المستخدمة (favorites) إن كانت مسجّلة */
    const SKEY = 'nb_saved_articles';
    const saved = () => { try { return JSON.parse(localStorage.getItem(SKEY) || '[]'); } catch (_) { return []; } };
    function isSaved() { return art && saved().some((x) => x.id === art.id); }
    function updateSaveBtn() { const b = document.getElementById('ar-save'); if (b) { b.classList.toggle('on', isSaved()); b.textContent = isSaved() ? '🔖 محفوظ' : '🔖 حفظ'; } }
    async function toggleSave() {
      let list = saved();
      const on = !isSaved();
      list = on ? [{ id: art.id, title: art.title, summary: (art.summary || '').slice(0, 140), imagePath: art.imagePath }, ...list].slice(0, 200) : list.filter((x) => x.id !== art.id);
      localStorage.setItem(SKEY, JSON.stringify(list));
      updateSaveBtn();
      window.nbToast?.(on ? 'حُفظ المقال في حسابكِ 🔖' : 'أُزيل من المحفوظات');
      if (user) {
        const ref = db.collection('users').doc(user.uid).collection('favorites').doc('article_' + art.id);
        try { on ? await ref.set({ type: 'article', articleId: art.id, title: art.title, savedAt: window.firebase.firestore.FieldValue.serverTimestamp() }) : await ref.delete(); } catch (_) {}
      }
    }

    function seo() {
      const url = 'https://nabda.online/article/' + art.id;
      const desc = String(art.summary || art.title).replace(/\s+/g, ' ').slice(0, 160);
      const img = 'https://nabda.online' + articleImg(art.imagePath);
      document.title = `${art.title} — نبضة`;
      const set = (attr, k, v) => { let m = document.querySelector(`meta[${attr}="${k}"]`); if (!m) { m = document.createElement('meta'); m.setAttribute(attr, k); document.head.appendChild(m); } m.content = v; };
      set('name', 'description', desc); set('property', 'og:title', art.title); set('property', 'og:description', desc);
      set('property', 'og:image', img); set('property', 'og:url', url);
      if (MEDICAL_SUBCATS.has(art.subcategoryId)) set('name', 'robots', 'noindex');
      const c = document.createElement('link'); c.rel = 'canonical'; c.href = url; document.head.appendChild(c);
      const ld = [{ '@context': 'https://schema.org', '@type': 'Article', headline: art.title, description: desc, image: [img], inLanguage: 'ar',
        author: { '@type': 'Organization', name: 'فريق تحرير نبضة', url: 'https://nabda.online' },
        publisher: { '@type': 'Organization', name: 'نبضة', logo: { '@type': 'ImageObject', url: 'https://nabda.online/favicon.png' } },
        mainEntityOfPage: url }];
      if ((art.faqs || []).length) ld.push({ '@context': 'https://schema.org', '@type': 'FAQPage', mainEntity: art.faqs.slice(0, 10).map((f) => ({ '@type': 'Question', name: f.question, acceptedAnswer: { '@type': 'Answer', text: f.answer } })) });
      const s = document.createElement('script'); s.type = 'application/ld+json'; s.textContent = JSON.stringify(ld); document.head.appendChild(s);
    }

    // شريط تقدّم القراءة
    window.addEventListener('scroll', () => {
      const h = document.documentElement;
      const p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
      document.getElementById('ar-progress').style.width = (p * 100).toFixed(1) + '%';
    }, { passive: true });

    load();
  </script>
  <script type="module" src="/js/shell.js"></script>
</body>
</html>
