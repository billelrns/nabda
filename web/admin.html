<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة تحكم نبضة</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <script>try { if (localStorage.getItem('ad_theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
  <script src="/vendor/chart.umd.min.js" defer></script>
</head>
<body>
  <!-- تحميل -->
  <div id="gate-loading" class="ad-gate"><div class="ad-gate-card"><div class="ad-gate-logo">💗</div><h1>لوحة تحكم نبضة</h1><p>جاري التحقّق من الصلاحيات…</p><div class="skel" style="height:8px"></div></div></div>

  <!-- تسجيل الدخول -->
  <div id="gate-login" class="ad-gate hidden">
    <div class="ad-gate-card">
      <div class="ad-gate-logo">💗</div>
      <h1>لوحة تحكم نبضة</h1>
      <p>دخول الطاقم فقط</p>
      <form id="login-form" autocomplete="on">
        <div class="field"><label for="lg-email">البريد الإلكتروني</label><input class="input" id="lg-email" type="email" required autocomplete="username" dir="ltr"></div>
        <div class="field"><label for="lg-pass">كلمة المرور</label><input class="input" id="lg-pass" type="password" required autocomplete="current-password" dir="ltr"></div>
        <button class="btn btn-primary" type="submit" style="height:44px;justify-content:center">دخول</button>
        <button class="btn" type="button" id="lg-google" style="height:44px;justify-content:center">الدخول عبر Google</button>
        <div id="lg-err" class="alert red hidden"></div>
      </form>
    </div>
  </div>

  <!-- غير مصرّح -->
  <div id="gate-denied" class="ad-gate hidden">
    <div class="ad-gate-card">
      <div class="ad-gate-logo" style="background:#9CA3AF">🔒</div>
      <h1>غير مصرّح</h1>
      <p id="denied-msg">هذا الحساب ليس ضمن طاقم نبضة النشط.</p>
      <div style="display:flex;gap:8px;justify-content:center"><a class="btn" href="/">الموقع</a><button class="btn btn-danger" id="denied-logout">تسجيل الخروج</button></div>
    </div>
  </div>

  <!-- التطبيق -->
  <div id="app" class="ad-app hidden">
    <aside class="ad-side" id="side">
      <div class="ad-brand"><div class="ad-brand-ic">💗</div><div class="ad-brand-txt">نبضة<small>لوحة التحكم</small></div></div>
      <nav class="ad-nav" id="nav"></nav>
      <div class="ad-side-foot">
        <a class="btn btn-ghost btn-sm" href="/" target="_blank" rel="noopener">🌐 <span class="ad-side-foot-txt">فتح الموقع</span></a>
        <button class="btn btn-ghost btn-sm" id="logout">🚪 <span class="ad-side-foot-txt">تسجيل الخروج</span></button>
      </div>
    </aside>
    <div class="ad-main">
      <header class="ad-top">
        <button class="ad-icon-btn" id="toggle-side" title="طيّ القائمة" aria-label="القائمة">☰</button>
        <div class="ad-search">
          <span class="ic">🔍</span>
          <input id="gsearch" placeholder="بحث: رقم هاتف، اسم زبونة، رقم طلب، منتج…" autocomplete="off" aria-label="بحث شامل">
          <kbd>Ctrl K</kbd>
          <div class="ad-search-results hidden" id="gsearch-results"></div>
        </div>
        <div class="ad-top-actions">
          <button class="ad-icon-btn" id="sound-btn" title="صوت الإشعارات">🔔</button>
          <button class="ad-icon-btn" id="theme-btn" title="الوضع الليلي">🌙</button>
          <div class="ad-me"><div><b id="me-name">—</b><small id="me-role">—</small></div><div class="ad-me-av" id="me-av">ن</div></div>
        </div>
      </header>
      <main class="ad-content" id="view"></main>
    </div>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-h"><h3 id="drawer-title"></h3><button class="ad-icon-btn" data-close-drawer aria-label="إغلاق">✕</button></div><div class="drawer-b" id="drawer-body"></div><div class="drawer-f" id="drawer-foot"></div></aside>
  <div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-card" id="modal-card"><div class="modal-h"><h3 id="modal-title"></h3><button class="ad-icon-btn" data-close-modal aria-label="إغلاق">✕</button></div><div class="modal-b" id="modal-body"></div><div class="modal-f" id="modal-foot"></div></div></div>
  <div class="toasts" id="toasts"></div>
  <div id="print-area"></div>

  <script type="module" src="/js/admin/app.js"></script>
</body>
</html>
