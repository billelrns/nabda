<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="نبضة — تطبيق صحة المرأة العربية: متابعة الحمل والدورة ورعاية الطفل ومجتمع الأمهات">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="نبضة">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon — شعار نبضة (القلبان). ?v=2 يجبر المتصفّح على تجاهل النسخة المخزّنة -->
  <link rel="icon" type="image/png" sizes="256x256" href="favicon.png?v=2"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=2"/>
  <meta name="theme-color" content="#E91E63">

  <!-- ─── تحميل مسبق لخطّ Almarai (يحلّ مشكلة □□□ عند أوّل تحميل) ─── -->
  <!-- preconnect: يبدأ TCP/TLS handshake مع خوادم Google Fonts باكرًا. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- display=swap: يعرض الخطّ الاحتياطي فورًا ثم يستبدله بـ Almarai عند الجهوزية. -->
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">

  <title>نبضة — صحة المرأة العربية</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- ─── شاشة تحميل: شعار نبضة (صورة 3D) ينبض كقلب حقيقي ─── -->
  <!-- الصورة كاملةً تنبض بإيقاع قلب الإنسان (نبضتان قويّتان ثمّ راحة).         -->
  <style>
    html, body { margin: 0; padding: 0; background: #FFF8FB; }
    #nabda-loader {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #FFF8FB;
      z-index: 9999;
      transition: opacity 0.35s ease-out;
    }
    #nabda-loader.hidden { opacity: 0; pointer-events: none; }

    /* الصورة كاملةً تنبض بإيقاع قلب حقيقي */
    .nabda-logo-img {
      width: 220px; height: 220px;
      object-fit: contain; display: block;
      animation: heartbeat 1.2s ease-in-out infinite;
      transform-origin: center;
    }

    /* إيقاع قلب: نبضة قويّة → ارتداد → نبضة ثانية أخفّ → راحة */
    @keyframes heartbeat {
      0%   { transform: scale(0.94); }
      14%  { transform: scale(1.10); }
      28%  { transform: scale(0.96); }
      42%  { transform: scale(1.06); }
      70%  { transform: scale(0.94); }
      100% { transform: scale(0.94); }
    }
  </style>

  <div id="nabda-loader">
    <img class="nabda-logo-img" src="nabda_heart.png" alt="نبضة" />
  </div>
  <script>
    // إخفاء الدوّار فور رسم Flutter لأوّل إطار.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('nabda-loader');
      if (!el) return;
      el.classList.add('hidden');
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>

  <!-- ─── زر «ثبّتي نبضة على هاتفكِ» (PWA) — بديل مؤقّت لمتجر Google Play ─── -->
  <!-- أندرويد/كروم: يظهر عند توفّر التثبيت. آيفون: تعليمات «إضافة إلى الشاشة الرئيسية». -->
  <!-- لا يظهر إن كان التطبيق مثبّتاً أو أُغلق الإشعار خلال آخر 7 أيام. -->
  <style>
    #nb-install{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10000;display:none;align-items:center;gap:8px;background:#fff;border:1px solid #F8BBD0;border-radius:16px;box-shadow:0 8px 24px rgba(194,24,91,.18);padding:8px 10px 8px 8px;font-family:Almarai,Tahoma,sans-serif;direction:rtl;width:max-content;max-width:calc(100% - 24px);box-sizing:border-box;font-size:14px;line-height:1.5;color:#3D2A33}
    #nb-install.show{display:flex}
    #nb-install b{color:#C2185B}
    #nb-install button{border:0;border-radius:10px;padding:8px 14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0}
    #nb-install .go{background:#E91E63;color:#fff}
    #nb-install .x{background:transparent;color:#9b8a92;padding:6px 8px}
  </style>
  <div id="nb-install" role="dialog" aria-label="تثبيت نبضة">
    <span id="nb-install-text">📲 ثبّتي <b>نبضة</b> على هاتفكِ</span>
    <button class="go" id="nb-install-go">تثبيت</button>
    <button class="x" id="nb-install-x" aria-label="إغلاق">✕</button>
  </div>
  <script>
    (function () {
      var KEY = 'nb_install_dismissed';
      function standalone() {
        return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
      }
      function dismissedRecently() {
        try { return Date.now() - (+localStorage.getItem(KEY) || 0) < 7 * 864e5; } catch (e) { return false; }
      }
      if (standalone() || dismissedRecently()) return;
      // الهاتف فقط — لا شيء يتغيّر على الحاسوب
      if (!(window.matchMedia('(max-width: 820px)').matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent))) return;
      var box = document.getElementById('nb-install');
      var go = document.getElementById('nb-install-go');
      var x = document.getElementById('nb-install-x');
      var txt = document.getElementById('nb-install-text');
      var deferred = null, ready = false, want = false;
      function show() { if (ready && want) box.classList.add('show'); }
      // نترك المستخدمة ترى التطبيق 4 ثوانٍ أوّلاً
      window.addEventListener('flutter-first-frame', function () { setTimeout(function () { ready = true; show(); }, 4000); });
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; want = true; show(); });
      var ua = navigator.userAgent || '';
      if (/iphone|ipad|ipod/i.test(ua)) {
        txt.innerHTML = '📲 لتثبيت <b>نبضة</b>: اضغطي زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»';
        go.style.display = 'none';
        want = true;
      }
      go.addEventListener('click', function () {
        if (!deferred) return;
        deferred.prompt();
        deferred.userChoice.then(function () { deferred = null; box.classList.remove('show'); });
      });
      x.addEventListener('click', function () {
        box.classList.remove('show');
        try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
      });
      window.addEventListener('appinstalled', function () { box.classList.remove('show'); });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
