name: nabda_app
description: NABDA - Women's Health App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  url_launcher: ^6.3.1
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  google_fonts: ^8.1.0           # ⬆️ 6.2.1 → 8.1.0 (API متوافق، تحسينات أداء)
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  table_calendar: ^3.2.0
  fl_chart: ^1.0.0
  shared_preferences: ^2.5.0
  go_router: ^14.0.0
  provider: ^6.1.5
  rxdart: ^0.28.0
  sqflite: ^2.4.3                # ⬆️ patch
  simple_gesture_detector: ^0.2.1
  http: ^1.2.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1              # ⬆️ patch فقط (0.11 يتعارض مع flutter_local_notifications 18)
  image_picker: ^1.2.2           # ⬆️ patch
  firebase_messaging: ^15.1.6
  firebase_storage: ^12.4.0
  video_player: ^2.9.2
  visibility_detector: ^0.4.0+2
  share_plus: ^10.1.4
  in_app_review: ^2.0.9
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# ─── أيقونة التطبيق: شعار نبضة (القلبان) ───
# التوليد:  dart run flutter_launcher_icons
# المصدر يُنشأ بـ:  powershell -ExecutionPolicy Bypass -File tools\make_icons.ps1
flutter_launcher_icons:
  image_path: "assets/icon/nabda_icon.png"

  android: "ic_launcher"          # نفس الاسم المُشار إليه في AndroidManifest
  min_sdk_android: 21
  adaptive_icon_background: "#FFF5F8"
  adaptive_icon_foreground: "assets/icon/nabda_icon_fg.png"

  ios: true
  remove_alpha_ios: true          # آبل ترفض الأيقونات ذات الشفافية

  web:
    generate: true
    image_path: "assets/icon/nabda_icon.png"
    background_color: "#FFF5F8"
    theme_color: "#E91E63"

  windows:
    generate: true
    image_path: "assets/icon/nabda_icon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/icon/nabda_icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/intro/
    - assets/icons_3d/
    - assets/images/fetus/
    - assets/images/fetus_hd/
    - assets/images/articles/
    - assets/images/articles_bg/
    - assets/images/article_pics/
    - assets/images/pregnancy_news/
    - assets/images/smart_articles/
    - assets/images/share_cards/
    # تسجيل ملفات البيانات التشغيلية فردياً لمنع تسريب ملفات العمل والنسخ الاحتياطية
    - assets/data/smart_2500_articles.json
    - assets/data/smart_100_articles.json
    - assets/data/arab_world_doctors.json
    - assets/data/algeria_cities.json
    - assets/data/article_titles.json
    - assets/data/algeria_wilaya_centroids.json
    - assets/data/news_images.json