name: nabda_app
description: NABDA - Women's Health App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  url_launcher: ^6.3.1
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  google_fonts: ^8.1.0           # ⬆️ 6.2.1 → 8.1.0 (API متوافق، تحسينات أداء)
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  table_calendar: ^3.2.0
  fl_chart: ^1.0.0
  shared_preferences: ^2.5.0
  go_router: ^14.0.0
  provider: ^6.1.5
  rxdart: ^0.28.0
  sqflite: ^2.4.3                # ⬆️ patch
  simple_gesture_detector: ^0.2.1
  http: ^1.2.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1              # ⬆️ patch فقط (0.11 يتعارض مع flutter_local_notifications 18)
  image_picker: ^1.2.2           # ⬆️ patch
  firebase_messaging: ^15.1.6
  firebase_storage: ^12.4.0
  video_player: ^2.9.2
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/intro/
    - assets/icons_3d/
    - assets/images/fetus/
    - assets/images/fetus_hd/
    - assets/images/articles/
    - assets/images/article_pics/
    - assets/images/pregnancy_news/
    - assets/images/smart_articles/
    - assets/data/algeria_cities.json
    - assets/data/smart_100_articles.json
    - assets/data/