# ═══════════════════════════════════════════════════════════════
#  إعدادات نحيفة جداً لجهاز 7غ رام
#  سبب الانهيار السابق: نفاد الذاكرة الأصلية (native) في خيط C2
#  أثناء dex/R8 — الحل: تعطيل مترجم C2 وتقليل الخيوط والذاكرة.
# ═══════════════════════════════════════════════════════════════

# -XX:TieredStopAtLevel=1  → يوقف مترجم C2 (هو الذي انهار) ويوفّر ذاكرة أصلية كبيرة
# -XX:+UseSerialGC         → جامع قمامة بخيط واحد بدل خيوط بعدد الأنوية الثمانية
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=96m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dfile.encoding=UTF-8

# بلا daemon: كل بناء في عملية مستقلة تُحرَّر ذاكرتها بالكامل بعده
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.vfs.watch=false

kotlin.daemon.jvmargs=-Xmx512m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC
kotlin.incremental=true

android.useAndroidX=true
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
